<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>超级小跳人 · 小游戏</title>
<style>
  html, body {
    margin: 0; padding: 0; background: #0e1420; color: #e8eef7;
    font-family: system-ui, "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }
  h1 { font-size: 20px; margin: 18px 0 8px; letter-spacing: 2px; }
  .wrap { position: relative; }
  canvas {
    background: #8fd3ff; border-radius: 10px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    display: block; max-width: 96vw; height: auto; cursor: pointer;
  }
  .hint {
    margin: 14px 0; color: #a8b3c2; font-size: 13px; line-height: 1.9; text-align: center;
    max-width: 800px;
  }
  kbd {
    background: #1c2637; border: 1px solid #33415a; border-radius: 5px;
    padding: 2px 7px; font-size: 12px; color: #dfe7f2;
  }
  .touch { display: none; gap: 12px; margin-top: 10px; user-select: none; }
  .touch button {
    width: 64px; height: 64px; font-size: 24px; border-radius: 14px;
    border: 1px solid #33415a; background: #1c2637; color: #e8eef7;
  }
  @media (pointer: coarse) { .touch { display: flex; } }
</style>
</head>
<body>
<h1>🍄 超级小跳人</h1>
<div class="wrap">
  <canvas id="game" width="800" height="600"></canvas>
</div>
<div class="touch">
  <button id="btnL">◀</button>
  <button id="btnR">▶</button>
  <button id="btnJ">⤒</button>
</div>
<div class="hint">
  <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>A</kbd> <kbd>D</kbd> 移动 &nbsp;·&nbsp;
  <kbd>空格</kbd>/<kbd>↑</kbd> 跳跃 &nbsp;·&nbsp; <kbd>M</kbd> 静音 &nbsp;·&nbsp; <kbd>R</kbd> 重开<br>
  踩扁敌人 · 吃金币 · 到达旗杆通关 🚩
</div>

<script>
"use strict";
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// ---- 常量 ----
const TILE = 40;
const COLS = 20, ROWS = 15;
const LEVEL_COLS = 120, LEVEL_ROWS = 15;
const WORLD_W = LEVEL_COLS * TILE;
const WORLD_H = LEVEL_ROWS * TILE;
const GRAVITY = 2300, MOVE_SPEED = 290, ACCEL = 2600, FRICTION = 3000;
const JUMP = -780, MAX_FALL = 1000, ENEMY_SPEED = 70;
const SOLID = new Set(['#', '?', '=', 'B']);

// ---- 状态 ----
let state = 'title'; // title | play | over | win
let grid = [];
let player = null;
let enemies = [];
let coins = [];
let particles = [];
let bumps = [];
let score = 0, coinCount = 0, lives = 3;
let camX = 0;
let now = 0, lastT = performance.now() / 1000;
let invincible = 0, jumpBuffer = 0;
let muted = false;

const input = { left: false, right: false, jump: false };

// ---- 音频 ----
let actx = null;
function ensureAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function beep(freq, dur, type, vol, slide) {
  if (!actx || muted) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, actx.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), actx.currentTime + dur);
  g.gain.setValueAtTime(vol || 0.12, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime + dur);
}
const playJump   = () => beep(300, 0.18, 'square', 0.12, 320);
const playCoin   = () => { beep(980, 0.09, 'square', 0.12); setTimeout(() => beep(1318, 0.14, 'square', 0.12), 60); };
const playStomp  = () => beep(240, 0.14, 'sawtooth', 0.12, -140);
const playHurt   = () => beep(200, 0.30, 'sawtooth', 0.12, -150);
const playBreak  = () => beep(120, 0.20, 'sawtooth', 0.12, -60);
const playBump   = () => beep(160, 0.08, 'square', 0.08, 40);
const playWin    = () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.18, 'square', 0.12), i * 120)); };

// ---- 关卡构建 ----
function buildLevel() {
  grid = [];
  for (let r = 0; r < LEVEL_ROWS; r++) grid.push(new Array(LEVEL_COLS).fill('.'));

  // 地面
  for (let c = 0; c < LEVEL_COLS; c++) { grid[13][c] = '#'; grid[14][c] = '#'; }
  // 深渊（坑）
  [[25, 27], [52, 54], [78, 80]].forEach(([a, b]) => {
    for (let c = a; c <= b; c++) { grid[13][c] = '.'; grid[14][c] = '.'; }
  });
  // 悬浮平台
  [[44, 46, 10], [55, 57, 8], [70, 72, 10], [96, 98, 8]].forEach(([a, b, y]) => {
    for (let c = a; c <= b; c++) grid[y][c] = '#';
  });
  // 问号砖（金币砖）
  [[10, 9], [11, 9], [12, 9], [33, 8], [63, 8], [93, 8]].forEach(([c, r]) => grid[r][c] = '?');
  // 砖块
  [[16, 9], [17, 9], [18, 9], [37, 9], [38, 9]].forEach(([c, r]) => grid[r][c] = 'B');
  // 终点前台阶
  [[106, 12], [107, 12], [108, 11], [109, 11], [110, 10], [111, 9]].forEach(([c, r]) => grid[r][c] = '#');

  // 金币
  coins = [];
  const addCoin = (x, y) => coins.push({ x, y, taken: false, phase: Math.random() * Math.PI * 2 });
  // 地面金币（走路即可吃到）
  [5, 6, 7, 60, 61].forEach(c => addCoin(c * TILE + TILE / 2, 12 * TILE + TILE / 2));
  // 坑上方弧形金币
  [[26, 26], [53, 53], [79, 79]].forEach(([c]) => {
    addCoin(c * TILE + TILE / 2, 11 * TILE + TILE / 2);
    addCoin(c * TILE + TILE / 2, 10 * TILE + TILE / 2);
    addCoin(c * TILE + TILE / 2, 9 * TILE + TILE / 2);
  });
  // 平台上空金币
  [45, 56, 71, 97].forEach(c => addCoin(c * TILE + TILE / 2, 7 * TILE + TILE / 2));

  // 敌人
  enemies = [];
  [8, 14, 21, 30, 40, 47, 61, 67, 84, 90, 100, 107].forEach((c, i) => {
    enemies.push({ x: c * TILE + 5, y: 13 * TILE - 28, w: 30, h: 28,
      vx: 0, vy: 0, dir: i % 2 ? 1 : -1, dead: false, squashT: 0 });
  });

  // 玩家
  player = { x: 2 * TILE + 6, y: 13 * TILE - 36, w: 28, h: 36, vx: 0, vy: 0, onGround: false, dir: 1, anim: 0, hitWall: 0, headHit: null };

  particles = []; bumps = [];
  score = 0; coinCount = 0; lives = 3; camX = 0;
  invincible = 0; jumpBuffer = 0;
}

function reset() { buildLevel(); state = 'play'; }
function startGame() { reset(); ensureAudio(); }

// ---- 碰撞 ----
function isSolidCell(c, r) {
  if (c < 0 || c >= LEVEL_COLS) return true;   // 左右边界墙
  if (r < 0) return false;
  if (r >= LEVEL_ROWS) return false;           // 掉出底部
  return SOLID.has(grid[r][c]);
}
function solidAtPoint(px, py) { return isSolidCell(Math.floor(px / TILE), Math.floor(py / TILE)); }

// 通用：移动并解析与方块的碰撞（玩家与敌人都用）
function moveBody(b, dt) {
  b.hitWall = 0; b.headHit = null;
  b.x += b.vx * dt;
  if (b.vx > 0) {
    const c = Math.floor((b.x + b.w) / TILE);
    const r0 = Math.floor(b.y / TILE), r1 = Math.floor((b.y + b.h - 0.01) / TILE);
    for (let r = r0; r <= r1; r++) if (isSolidCell(c, r)) { b.x = c * TILE - b.w - 0.001; b.hitWall = 1; b.vx = 0; break; }
  } else if (b.vx < 0) {
    const c = Math.floor(b.x / TILE);
    const r0 = Math.floor(b.y / TILE), r1 = Math.floor((b.y + b.h - 0.01) / TILE);
    for (let r = r0; r <= r1; r++) if (isSolidCell(c, r)) { b.x = (c + 1) * TILE + 0.001; b.hitWall = -1; b.vx = 0; break; }
  }
  b.y += b.vy * dt;
  b.onGround = false;
  if (b.vy > 0) {
    const r = Math.floor((b.y + b.h) / TILE);
    const c0 = Math.floor(b.x / TILE), c1 = Math.floor((b.x + b.w - 0.01) / TILE);
    for (let c = c0; c <= c1; c++) if (isSolidCell(c, r)) { b.y = r * TILE - b.h - 0.001; b.vy = 0; b.onGround = true; break; }
  } else if (b.vy < 0) {
    const r = Math.floor(b.y / TILE);
    const c0 = Math.floor(b.x / TILE), c1 = Math.floor((b.x + b.w - 0.01) / TILE);
    for (let c = c0; c <= c1; c++) if (isSolidCell(c, r)) { b.y = (r + 1) * TILE + 0.001; b.vy = 0; b.headHit = { c, r }; break; }
  }
}

// ---- 特效 ----
function addPopCoin(x, y) {
  particles.push({ x, y: y - 6, vx: 0, vy: -260, type: 'coin', life: 0.5, maxLife: 0.5, grav: false, size: 10, color: '#f7b731' });
}
function spawnFragments(x, y) {
  for (let i = 0; i < 4; i++) {
    particles.push({ x, y, vx: (i < 2 ? -1 : 1) * (60 + Math.random() * 80), vy: -150 - Math.random() * 150,
      type: 'brick', life: 0.7, maxLife: 0.7, grav: true, size: 8, color: '#c75b39' });
  }
}

// ---- 更新 ----
function update(dt) {
  if (state !== 'play') return;
  const p = player;
  invincible = Math.max(0, invincible - dt);
  jumpBuffer = Math.max(0, jumpBuffer - dt);

  // 水平移动
  const target = (input.right ? MOVE_SPEED : 0) + (input.left ? -MOVE_SPEED : 0);
  if (input.right && !input.left) p.dir = 1;
  if (input.left && !input.right) p.dir = -1;
  if (target !== 0) {
    p.vx += (target - p.vx) > 0 ? Math.min(ACCEL * dt, target - p.vx) : Math.max(-ACCEL * dt, target - p.vx);
  } else {
    const f = FRICTION * dt;
    if (p.vx > 0) p.vx = Math.max(0, p.vx - f);
    else p.vx = Math.min(0, p.vx + f);
  }
  p.anim += Math.abs(p.vx) * dt;

  // 跳跃
  if (p.onGround && jumpBuffer > 0) { p.vy = JUMP; p.onGround = false; jumpBuffer = 0; playJump(); }

  // 重力
  p.vy = Math.min(MAX_FALL, p.vy + GRAVITY * dt);
  moveBody(p, dt);

  // 头顶撞击
  if (p.headHit) {
    const { c, r } = p.headHit;
    const tile = grid[r][c];
    if (tile === '?') {
      grid[r][c] = '='; addPopCoin(c * TILE + TILE / 2, r * TILE);
      score += 100; coinCount++; bumps.push({ c, r, t: 0.2 }); playCoin();
    } else if (tile === 'B') {
      grid[r][c] = '.'; spawnFragments(c * TILE + TILE / 2, r * TILE);
      score += 50; playBreak();
    } else if (tile === '#' || tile === '=') {
      bumps.push({ c, r, t: 0.2 }); playBump();
    }
  }

  // 掉坑
  if (p.y > WORLD_H + 40) { loseLife(); return; }

  // 敌人
  for (const e of enemies) {
    if (e.dead) { e.squashT -= dt; continue; }
    e.vx = e.dir * ENEMY_SPEED;
    e.vy = Math.min(MAX_FALL, e.vy + GRAVITY * dt);
    moveBody(e, dt);
    if (e.hitWall) e.dir = -e.dir;
    else if (e.onGround) {
      const aheadX = e.dir > 0 ? e.x + e.w + 2 : e.x - 2;
      if (!solidAtPoint(aheadX, e.y + e.h + 2)) e.dir = -e.dir; // 前方是悬崖，掉头
    }
  }
  enemies = enemies.filter(e => !(e.dead && e.squashT <= 0));

  // 玩家 vs 敌人
  for (const e of enemies) {
    if (e.dead) continue;
    if (aabb(p, e)) {
      if (p.vy > 0 && (p.y + p.h) - e.y < 16) { // 踩中
        e.dead = true; e.squashT = 0.4; p.vy = -420; score += 200; playStomp();
      } else if (invincible <= 0) {
        hurt(e.x < p.x ? 1 : -1);
      }
    }
  }

  // 金币
  for (const c of coins) {
    if (!c.taken && rectCircleOverlap(p, c.x, c.y, 12)) {
      c.taken = true; coinCount++; score += 100; playCoin();
    }
  }

  // 终点
  const FLAG_X = 113 * TILE;
  if (p.x + p.w >= FLAG_X) { state = 'win'; playWin(); }

  // 粒子 & 砖块动画
  for (const pt of particles) {
    pt.life -= dt;
    if (pt.grav) pt.vy += GRAVITY * dt;
    pt.x += pt.vx * dt; pt.y += pt.vy * dt;
  }
  particles = particles.filter(pt => pt.life > 0);
  for (const b of bumps) b.t -= dt;
  bumps = bumps.filter(b => b.t > 0);

  // 镜头
  const targetCam = Math.max(0, Math.min(p.x + p.w / 2 - canvas.width / 2, WORLD_W - canvas.width));
  camX += (targetCam - camX) * Math.min(1, 8 * dt);
}

function aabb(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function rectCircleOverlap(r, cx, cy, rad) {
  const nx = Math.max(r.x, Math.min(cx, r.x + r.w));
  const ny = Math.max(r.y, Math.min(cy, r.y + r.h));
  return (cx - nx) ** 2 + (cy - ny) ** 2 < rad * rad;
}

function hurt(dir) {
  lives--;
  invincible = 2;
  player.vx = dir * 200; player.vy = -280;
  playHurt();
  if (lives <= 0) state = 'over';
}
function loseLife() {
  lives--; playHurt();
  if (lives <= 0) { state = 'over'; return; }
  // 重生
  player.x = 2 * TILE + 6; player.y = 13 * TILE - 36; player.vx = 0; player.vy = 0;
  invincible = 2;
}

// ---- 渲染 ----
function render() {
  // 天空
  const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
  sky.addColorStop(0, '#6ec3ff'); sky.addColorStop(1, '#d7f0ff');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawClouds();
  drawHills();
  drawTiles();
  drawFlag();
  for (const c of coins) if (!c.taken) drawCoin(c);
  for (const e of enemies) drawEnemy(e);
  for (const pt of particles) drawParticle(pt);
  drawPlayer();
  drawHUD();
  drawOverlay();
}

function drawClouds() {
  const clouds = [[120, 80, 1], [420, 130, 1.4], [760, 70, 0.9], [1100, 160, 1.2], [1500, 90, 1], [1900, 140, 1.3], [2300, 80, 0.8], [2800, 150, 1.1], [3300, 100, 1.3], [3800, 70, 0.9], [4300, 150, 1.2]];
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  for (const [x, y, s] of clouds) {
    const cx = x - camX * 0.3, cy = y;
    if (cx < -150 || cx > canvas.width + 150) continue;
    ctx.beginPath();
    ctx.arc(cx, cy, 22 * s, 0, 7); ctx.arc(cx + 22 * s, cy - 8 * s, 18 * s, 0, 7);
    ctx.arc(cx + 46 * s, cy, 20 * s, 0, 7); ctx.arc(cx + 22 * s, cy + 6 * s, 20 * s, 0, 7);
    ctx.fill();
  }
}
function drawHills() {
  const hills = [[0, 1], [700, 1.2], [1500, 0.9], [2400, 1.1], [3300, 1], [4100, 1.2]];
  ctx.fillStyle = '#6ecf6a';
  for (const [x, s] of hills) {
    const cx = x - camX * 0.5, base = WORLD_H;
    if (cx < -400 || cx > canvas.width + 400) continue;
    ctx.beginPath(); ctx.ellipse(cx, base, 220 * s, 90 * s, 0, Math.PI, 0); ctx.fill();
  }
}

function bumpOffset(c, r) {
  for (const b of bumps) if (b.c === c && b.r === r) return -Math.sin(((0.2 - b.t) / 0.2) * Math.PI) * 6;
  return 0;
}

function drawTiles() {
  const c0 = Math.max(0, Math.floor(camX / TILE) - 1);
  const c1 = Math.min(LEVEL_COLS - 1, c0 + COLS + 2);
  for (let r = 0; r < ROWS; r++) {
    for (let c = c0; c <= c1; c++) {
      const ch = grid[r][c];
      if (ch === '.') continue;
      const x = c * TILE - camX, y = r * TILE + bumpOffset(c, r);
      if (ch === '#') {
        ctx.fillStyle = '#b9825c'; ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = '#8f5a37'; ctx.fillRect(x, y + TILE - 7, TILE, 7);
        ctx.fillStyle = '#a06a3f';
        ctx.fillRect(x + 8, y + 16, 6, 5); ctx.fillRect(x + 26, y + 26, 6, 5); ctx.fillRect(x + 14, y + 32, 6, 4);
        const above = r > 0 ? grid[r - 1][c] : '.';
        if (above === '.' || above === '?' || above === 'B') {
          ctx.fillStyle = '#54c052'; ctx.fillRect(x, y, TILE, 6);
          ctx.fillRect(x + 4, y - 2, 4, 4); ctx.fillRect(x + 20, y - 2, 4, 4);
        }
      } else if (ch === 'B') {
        ctx.fillStyle = '#c75b39'; ctx.fillRect(x, y, TILE, TILE);
        ctx.strokeStyle = '#8a3d22'; ctx.lineWidth = 2;
        ctx.strokeRect(x + 1, y + 1, TILE - 2, TILE - 2);
        ctx.beginPath(); ctx.moveTo(x, y + TILE / 2); ctx.lineTo(x + TILE, y + TILE / 2);
        ctx.moveTo(x + TILE / 2, y); ctx.lineTo(x + TILE / 2, y + TILE / 2);
        ctx.moveTo(x + TILE / 4, y + TILE / 2); ctx.lineTo(x + TILE / 4, y + TILE);
        ctx.moveTo(x + 3 * TILE / 4, y + TILE / 2); ctx.lineTo(x + 3 * TILE / 4, y + TILE);
        ctx.stroke();
      } else if (ch === '?') {
        ctx.fillStyle = '#f7b731'; ctx.fillRect(x, y, TILE, TILE);
        ctx.strokeStyle = '#b97a12'; ctx.lineWidth = 3; ctx.strokeRect(x + 1.5, y + 1.5, TILE - 3, TILE - 3);
        ctx.fillStyle = '#7a4a00'; ctx.font = 'bold 24px system-ui';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('?', x + TILE / 2, y + TILE / 2 + 1);
        ctx.fillStyle = '#ffdf8a'; ctx.fillRect(x + 6, y + 6, 5, 5); ctx.fillRect(x + TILE - 11, y + TILE - 11, 5, 5);
      } else if (ch === '=') {
        ctx.fillStyle = '#9a7a52'; ctx.fillRect(x, y, TILE, TILE);
        ctx.strokeStyle = '#6b5335'; ctx.lineWidth = 2; ctx.strokeRect(x + 1.5, y + 1.5, TILE - 3, TILE - 3);
        ctx.fillStyle = '#6b5335';
        ctx.beginPath(); ctx.arc(x + 8, y + 8, 2, 0, 7); ctx.arc(x + TILE - 8, y + 8, 2, 0, 7);
        ctx.arc(x + 8, y + TILE - 8, 2, 0, 7); ctx.arc(x + TILE - 8, y + TILE - 8, 2, 0, 7); ctx.fill();
      }
    }
  }
}

function drawCoin(c) {
  const s = Math.abs(Math.sin(now * 4 + c.phase));
  ctx.save();
  ctx.translate(c.x - camX, c.y);
  ctx.scale(Math.max(0.15, s), 1);
  ctx.fillStyle = '#f7b731'; ctx.beginPath(); ctx.arc(0, 0, 11, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffe28a'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, 7); ctx.fill();
  ctx.fillStyle = '#f7b731'; ctx.fillRect(-1.5, -9, 3, 18);
  ctx.restore();
}

function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x - camX + e.w / 2, e.y + e.h / 2);
  if (e.dead) ctx.scale(1, 0.3);
  ctx.fillStyle = '#8a4b2a';
  ctx.beginPath();
  ctx.moveTo(2, e.h); ctx.lineTo(2, 16);
  ctx.quadraticCurveTo(2, 4, e.w / 2, 4);
  ctx.quadraticCurveTo(e.w - 2, 4, e.w - 2, 16);
  ctx.lineTo(e.w - 2, e.h); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#5b2f17';
  ctx.fillRect(1, e.h - 6, 8, 6); ctx.fillRect(e.w - 9, e.h - 6, 8, 6);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(8, 14, 4, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(e.w - 8, 14, 4, 0, 7); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(9, 14, 2, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(e.w - 7, 14, 2, 0, 7); ctx.fill();
  ctx.strokeStyle = '#3a1c0a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(4, 8); ctx.lineTo(11, 11); ctx.moveTo(e.w - 4, 8); ctx.lineTo(e.w - 11, 11); ctx.stroke();
  ctx.restore();
}

function drawPlayer() {
  const p = player;
  ctx.save();
  if (invincible > 0 && Math.floor(now * 12) % 2 === 0) ctx.globalAlpha = 0.35;
  ctx.translate(p.x - camX + p.w / 2, p.y + p.h / 2);
  if (p.dir < 0) ctx.scale(-1, 1);
  ctx.translate(-p.w / 2, -p.h / 2);
  const w = p.w, h = p.h, leg = p.onGround && Math.abs(p.vx) > 10 ? Math.sin(p.anim * 0.25) * 2 : 0;
  // 帽子
  ctx.fillStyle = '#e33'; ctx.fillRect(0, 0, w, 7); ctx.fillRect(2, 5, w - 2, 4);
  // 脸
  ctx.fillStyle = '#ffd9a0'; ctx.fillRect(3, 7, w - 6, 9);
  ctx.fillStyle = '#7a4a20'; ctx.fillRect(3, 6, 6, 3); // 头发
  ctx.fillStyle = '#222'; ctx.fillRect(w - 10, 8, 3, 3); // 眼睛
  // 手臂
  ctx.fillStyle = '#ffd9a0'; ctx.fillRect(0, 16, 3, 6); ctx.fillRect(w - 3, 16, 3, 6);
  // 上衣
  ctx.fillStyle = '#e33'; ctx.fillRect(3, 16, w - 6, 8);
  // 背带裤
  ctx.fillStyle = '#2d6cdf'; ctx.fillRect(3, 23, w - 6, 9);
  ctx.fillStyle = '#f7d33c'; ctx.fillRect(8, 23, 3, 3); ctx.fillRect(w - 11, 23, 3, 3);
  // 腿和鞋
  ctx.fillStyle = '#2d6cdf'; ctx.fillRect(4, 32 + leg, 8, 3); ctx.fillRect(w - 12, 32 - leg, 8, 3);
  ctx.fillStyle = '#7a4a20'; ctx.fillRect(3, 35 + leg, 9, 2); ctx.fillRect(w - 12, 35 - leg, 9, 2);
  ctx.restore();
}

function drawParticle(pt) {
  const a = Math.max(0, pt.life / pt.maxLife);
  ctx.globalAlpha = a;
  if (pt.type === 'coin') {
    ctx.fillStyle = '#f7b731'; ctx.beginPath(); ctx.arc(pt.x - camX, pt.y, pt.size, 0, 7); ctx.fill();
  } else {
    ctx.fillStyle = pt.color; ctx.fillRect(pt.x - camX - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
  }
  ctx.globalAlpha = 1;
}

function drawFlag() {
  const fx = 113 * TILE - camX;
  ctx.fillStyle = '#9aa'; ctx.fillRect(fx + 6, 4 * TILE, 6, 9 * TILE);
  ctx.fillStyle = '#555'; ctx.fillRect(fx + 3, 13 * TILE, 12, 5);
  ctx.fillStyle = '#22b14c';
  ctx.beginPath(); ctx.moveTo(fx + 12, 4 * TILE + 8); ctx.lineTo(fx + 44, 4 * TILE + 20); ctx.lineTo(fx + 12, 4 * TILE + 32); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(fx + 20, 4 * TILE + 20, 4, 0, 7); ctx.fill();
}

function drawHUD() {
  ctx.font = 'bold 20px system-ui'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillText('得分 ' + score, 16, 30);
  ctx.fillStyle = '#fff'; ctx.fillText('得分 ' + score, 15, 29);
  ctx.fillStyle = '#f7b731'; ctx.beginPath(); ctx.arc(150, 28, 9, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillText('× ' + coinCount, 168, 30);
  ctx.fillStyle = '#fff'; ctx.fillText('× ' + coinCount, 167, 29);
  // 生命
  for (let i = 0; i < 3; i++) {
    const hx = canvas.width - 30 - i * 30;
    ctx.fillStyle = i < lives ? '#ff5a6e' : 'rgba(255,255,255,0.25)';
    ctx.beginPath();
    ctx.moveTo(hx, 34); ctx.bezierCurveTo(hx - 12, 22, hx - 4, 18, hx, 26);
    ctx.bezierCurveTo(hx + 4, 18, hx + 12, 22, hx, 34);
    ctx.fill();
  }
}

function drawOverlay() {
  if (state === 'play') return;
  ctx.fillStyle = 'rgba(10, 14, 26, 0.62)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let title = '', sub = '';
  if (state === 'title') {
    title = '🍄 超级小跳人';
    sub = '按 空格 或 点击屏幕 开始\n← → 移动 · 空格 跳跃 · 踩扁敌人 · 到达旗杆';
  } else if (state === 'over') {
    title = '💀 游戏结束';
    sub = '最终得分：' + score + '\n按 R 重新开始';
  } else if (state === 'win') {
    title = '🎉 通关成功！';
    sub = '最终得分：' + score + ' · 金币：' + coinCount + '\n按 R 再玩一次';
  }
  ctx.fillStyle = '#fff'; ctx.font = 'bold 44px system-ui';
  ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 40);
  ctx.font = '18px system-ui'; ctx.fillStyle = '#dfe7f2';
  const lines = sub.split('\n');
  lines.forEach((ln, i) => ctx.fillText(ln, canvas.width / 2, canvas.height / 2 + 20 + i * 28));
  ctx.textAlign = 'left';
}

// ---- 输入 ----
function jumpPress() {
  ensureAudio();
  if (state === 'title') { startGame(); return; }
  if (state === 'play') { input.jump = true; jumpBuffer = 0.12; }
}
function jumpRelease() {
  input.jump = false;
  if (player && player.vy < 0) player.vy *= 0.45; // 松键提前下落
}
window.addEventListener('keydown', e => {
  const k = e.key;
  if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') { e.preventDefault(); jumpPress(); }
  else if (k === 'ArrowLeft' || k === 'a' || k === 'A') input.left = true;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') input.right = true;
  else if (k === 'm' || k === 'M') muted = !muted;
  else if (k === 'r' || k === 'R') { if (state !== 'title') reset(); }
  else if (k === 'Enter') { if (state === 'title') startGame(); }
});
window.addEventListener('keyup', e => {
  const k = e.key;
  if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') jumpRelease();
  else if (k === 'ArrowLeft' || k === 'a' || k === 'A') input.left = false;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') input.right = false;
});
canvas.addEventListener('pointerdown', () => {
  ensureAudio();
  if (state === 'title') startGame();
  else if (state === 'over' || state === 'win') reset();
});
// 触屏按钮
function bindTouch(id, on, off) {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); on(); });
  el.addEventListener('pointerup', e => { e.preventDefault(); off(); });
  el.addEventListener('pointerleave', () => off());
  el.addEventListener('pointercancel', () => off());
}
bindTouch('btnL', () => input.left = true, () => input.left = false);
bindTouch('btnR', () => input.right = true, () => input.right = false);
bindTouch('btnJ', jumpPress, jumpRelease);

// ---- 主循环 ----
buildLevel();
function frame() {
  const t = performance.now() / 1000;
  let dt = t - lastT; lastT = t;
  if (dt > 0.05) dt = 0.05;
  now = t;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
